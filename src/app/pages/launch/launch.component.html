<div class="launch-container">
  <div class="spinner-wrapper" *ngIf="loading">
    <div class="loader-card">
      <div class="brand-mark">
        <span class="brand-dot dot-1"></span>
        <span class="brand-dot dot-2"></span>
        <span class="brand-dot dot-3"></span>
      </div>

      <div class="spinner-ring" aria-hidden="true">
        <div class="ring ring-outer"></div>
        <div class="ring ring-inner"></div>
        <div class="spinner-center">
          <span class="icon-check">✓</span>
        </div>
      </div>

      <!-- <h1 class="brand-title">BridgeSoft</h1> -->
      @for (message of [currentMessage]; track messageIndex) {
        <p class="loading-text">
          {{ message }}<span class="dots"
            ><span>.</span><span>.</span><span>.</span></span
          >
        </p>
      }

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
