<div class="login-container">
  <div class="login-box">
    <div class="logo-container">
      <!-- Recreating the BridgeSoft text-based logo -->
      <div class="logo-text">
        <img src="/svg/logo.svg" />
      </div>
    </div>

    <div class="spinner-wrapper" *ngIf="loading">
      <div class="login-spinner-ring" aria-hidden="true">
        <div class="ring ring-outer"></div>
        <div class="ring ring-inner"></div>
        <div class="ring ring-dot"></div>
      </div>
      <h2>Please wait...</h2>
      <p class="subtitle">Verifying your session<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
      <div class="login-progress-track">
        <div class="login-progress-fill"></div>
      </div>
    </div>

    <ng-container *ngIf="!loading">
      <h2>Login</h2>
      <p class="subtitle">Enter your credentials below</p>

      <form>
        <div class="input-group">
          <label for="username">Username </label>
          <div class="input-wrapper">
            <!-- Simple User Icon (could use FontAwesome for better quality) -->

            <input
              [(ngModel)]="loginObj.username"
              type="text"
              id="username"
              name="username"
              placeholder="e.g. administrator"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="password">Password</label>
          </div>
          <div class="input-wrapper">
            <!-- Simple Lock Icon -->

            <input
              [(ngModel)]="loginObj.password"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••••••"
              required
            />
          </div>
        </div>

        <div class="form-actions">
          <button (click)="onLogin()" type="submit" class="btn-primary">
            Sign In
          </button>
        </div>
      </form>
    </ng-container>
  </div>
</div>
